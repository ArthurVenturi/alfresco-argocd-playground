# Set root logger level to error
rootLogger.level=DEBUG #error
rootLogger.appenderRef.stdout.ref=ConsoleAppender
rootLogger.appenderRef.rolling.ref=RollingAppender

###### Console appender definition #######
appender.console.type=Console
appender.console.name=ConsoleAppender
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{ISO8601} %x %-5p [%c{3}] [%t] %replace{%m}{[\r\n]+}{}%n

###### File appender definition #######
appender.rolling.type=RollingFile
appender.rolling.name=RollingAppender
appender.rolling.fileName=/usr/local/tomcat/logs/alfresco.log
appender.rolling.filePattern=/usr/local/tomcat/logs/alfresco.log.%d{yyyy-MM-dd}.%i
appender.rolling.layout.type=PatternLayout
appender.rolling.layout.pattern=%d{yyyy-MM-dd} %d{ABSOLUTE} %-5p [%c] [%t] %replace{%m}{[\r\n]+}{}%n


###### Logs Rotate customizado (OCEPAR) - Mantem 7 dias de logs ou 10MB por arquivo ######
appender.rolling.policies.type=Policies
appender.rolling.policies.time.type=TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval=1
appender.rolling.policies.size.type=SizeBasedTriggeringPolicy
appender.rolling.policies.size.size=10MB

###### estrategia de delecao #######
appender.rolling.strategy.type=DefaultRolloverStrategy
appender.rolling.strategy.action.type=Delete
appender.rolling.strategy.action.basePath=/usr/local/tomcat/logs
appender.rolling.strategy.action.maxDepth=1

# condicoes: dever ser mais de 7d de idade e combinar com um dos globs
appender.rolling.strategy.action.condition.type=IfAll
appender.rolling.strategy.action.condition.age.type=IfLastModified
appender.rolling.strategy.action.condition.age.age=1d

appender.rolling.strategy.action.condition.any.type=IfAny
appender.rolling.strategy.action.condition.any.1.type=IfFileName
appender.rolling.strategy.action.condition.any.1.glob=alfresco.log.*
appender.rolling.strategy.action.condition.any.2.type=IfFileName
appender.rolling.strategy.action.condition.any.2.glob=catalina.*.log
appender.rolling.strategy.action.condition.any.3.type=IfFileName
appender.rolling.strategy.action.condition.any.3.glob=localhost_access_log.*
appender.rolling.strategy.action.condition.any.4.type=IfFileName
appender.rolling.strategy.action.condition.any.4.glob=localhost.*

